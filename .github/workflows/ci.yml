name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GH_AW_VERSION: v1.0.1   # gh-aw release whose frontmatter schema we validate against

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: End-to-end on the sample Maven project (no Wiz, no agent)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/wiz"
          mkdir -p "$out"
          (cd tests/fixtures/sample-project && mvn -B -ntp -q \
            org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree \
            -DoutputType=json -DappendOutput=true -DoutputFile="$out/dependency-tree.json")
          python -m wizconnector deps --tree "$out/dependency-tree.json" \
            --repo-root tests/fixtures/sample-project --out "$out/direct-deps.json"
          # the publish job only gets direct-deps.json + findings.json (no POMs, no trees)
          python -m wizconnector report --deps "$out/direct-deps.json" \
            --findings tests/fixtures/wiz-findings.json --out-dir "$out/report"
          test "$(jq '.upgrades | length' "$out/report/report.json")" -eq 4
          cat "$out/report/issue-body.md" >> "$GITHUB_STEP_SUMMARY"

  validate-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate gh-aw frontmatter against the gh-aw JSON schema
        run: |
          set -euo pipefail
          pip install --quiet pyyaml jsonschema
          curl -fsSL -o "$RUNNER_TEMP/schema.json" \
            "https://raw.githubusercontent.com/github/gh-aw/${GH_AW_VERSION}/pkg/parser/schemas/main_workflow_schema.json"
          python tests/validate_workflow.py "$RUNNER_TEMP/schema.json" workflows/*.md shared/mcp/*.md
